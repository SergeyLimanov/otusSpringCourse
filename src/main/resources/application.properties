# H2 in-memory

spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate

spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:h2:mem:librarydb
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Web server
server.port=8080

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,logfile,info,env,threaddump,heapdump,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.circuitbreakers.enabled=true

# Metrics Configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# External Microservices Configuration
external.authors.service.url=http://localhost:8081

# ========================================
# Resilience4j Configuration
# ========================================

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.externalAuthors.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalAuthors.slidingWindowSize=10
resilience4j.circuitbreaker.instances.externalAuthors.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.externalAuthors.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.externalAuthors.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.externalAuthors.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.externalAuthors.failureRateThreshold=50
resilience4j.circuitbreaker.instances.externalAuthors.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.externalAuthors.recordExceptions=org.springframework.web.client.RestClientException,java.io.IOException,java.util.concurrent.TimeoutException

# Retry Configuration
resilience4j.retry.instances.externalAuthors.maxAttempts=3
resilience4j.retry.instances.externalAuthors.waitDuration=1s
resilience4j.retry.instances.externalAuthors.enableExponentialBackoff=true
resilience4j.retry.instances.externalAuthors.exponentialBackoffMultiplier=2
resilience4j.retry.instances.externalAuthors.retryExceptions=org.springframework.web.client.RestClientException,java.io.IOException

# Time Limiter Configuration
resilience4j.timelimiter.instances.externalAuthors.timeoutDuration=5s
resilience4j.timelimiter.instances.externalAuthors.cancelRunningFuture=true

# Bulkhead Configuration (optional - ограничение параллельных вызовов)
resilience4j.bulkhead.instances.externalAuthors.maxConcurrentCalls=10
resilience4j.bulkhead.instances.externalAuthors.maxWaitDuration=1s