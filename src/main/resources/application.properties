# H2 in-memory

spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate

spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:h2:mem:librarydb
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Web server
server.port=8080

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,logfile,info,env,threaddump,heapdump,circuitbreakers,circuitbreakerevents,ratelimiters,retries,bulkheads
management.endpoint.health.show-details=always
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Resilience4j Health Indicators
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# Metrics Configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# External Microservices Configuration
external.authors.service.url=http://localhost:8081

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=library-app-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
kafka.topics.author-request=author-request-topic
kafka.topics.author-response=author-response-topic

# Kafka Request Timeout (in milliseconds)
kafka.request.timeout=5000

# ===================================
# Resilience4j Configuration
# ===================================

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.externalAuthorService.sliding-window-size=10
resilience4j.circuitbreaker.instances.externalAuthorService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.externalAuthorService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.externalAuthorService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.externalAuthorService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.externalAuthorService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.externalAuthorService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.externalAuthorService.record-exceptions=java.util.concurrent.TimeoutException,java.lang.Exception

# Retry Configuration
resilience4j.retry.instances.externalAuthorService.max-attempts=3
resilience4j.retry.instances.externalAuthorService.wait-duration=1000
resilience4j.retry.instances.externalAuthorService.retry-exceptions=java.util.concurrent.TimeoutException,org.springframework.kafka.KafkaException

# Time Limiter Configuration
resilience4j.timelimiter.instances.externalAuthorService.timeout-duration=6s
resilience4j.timelimiter.instances.externalAuthorService.cancel-running-future=true

# Bulkhead Configuration (для ограничения параллельных вызовов)
resilience4j.bulkhead.instances.externalAuthorService.max-concurrent-calls=10
resilience4j.bulkhead.instances.externalAuthorService.max-wait-duration=500ms

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.externalAuthorService.limit-for-period=50
resilience4j.ratelimiter.instances.externalAuthorService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.externalAuthorService.timeout-duration=0s